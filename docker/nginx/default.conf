# Nginx reverse proxy (OPCIONAL) — use apenas se quiser colocar Nginx na frente do Apache.
# O backend usa Apache na porta 80, não PHP-FPM na porta 9000.
# Para usar: adicionar este serviço ao docker-compose.yml e mapear as portas adequadamente.

server {
    listen 80;
    server_name localhost;

    # Frontend Static SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy to Laravel API
    location /api/ {
        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
