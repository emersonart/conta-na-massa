services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: conta_na_massa_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-conta_na_massa}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Laravel 13 API Backend
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: conta_na_massa_backend
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - APP_BUILD_ASSETS=true
    depends_on:
      - postgres
    volumes:
      - ./backend:/var/www/html            # código fonte (editável do host)
      - vendor_data:/var/www/html/vendor   # vendor PHP fica no container (I/O nativo)
      - node_modules_data:/var/www/html/node_modules  # node_modules no container
    networks:
      - app-network


  # Mailpit (Local SMTP Server for Testing Emails without Sending)
  mailpit:
    image: axllent/mailpit:latest
    container_name: conta_na_massa_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP Port
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  vendor_data:
    driver: local
  node_modules_data:
    driver: local

networks:
  app-network:
    driver: bridge
